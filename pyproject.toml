[project]
name = "cmt"
version = "0.1.0"
description = "AI-powered Git commit message generator"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Bijay Das", email = "me@bijaydas.com"},
]
dependencies = [
    "pydantic>=2.13.4",
    "typer>=0.27.1",
]
[project.scripts]
cmt = "cmt.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
keywords = ["ai", "git", "commit", "message", "generator"]
