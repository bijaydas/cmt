[project]
name = "cmt-cli"
version = "0.2.0"
description = "AI-powered Git commit message generator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [
    { name = "Bijay Das", email = "me@bijaydas.com" },
]
dependencies = [
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "pydantic>=2.13.4",
    "typer>=0.27.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control",
]

[project.scripts]
cmt = "cmt.cli:app"

[project.urls]
Homepage = "https://github.com/bijaydas/cmt"
Documentation = "https://github.com/bijaydas/cmt#readme"
Repository = "https://github.com/bijaydas/cmt"
Issues = "https://github.com/bijaydas/cmt/issues"
Changelog = "https://github.com/bijaydas/cmt/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
keywords = ["ai", "git", "commit", "message", "generator"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort (import sorting)
    "UP", # pyupgrade (modern syntax)
    "B", # flake8-bugbear (common bugs)
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.wheel]
packages = ["src/cmt"]
