[project]
name = "cmt"
version = "0.1.0"
description = "AI-powered Git commit message generator"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Bijay Das", email = "me@bijaydas.com"},
]
dependencies = [
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "pydantic>=2.13.4",
    "typer>=0.27.1",
]

[project.scripts]
cmt = "cmt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
keywords = ["ai", "git", "commit", "message", "generator"]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (common bugs)
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "double"
