[project]
name = "cmt-cli"
version = "1.4.0"
description = "AI-powered Git commit message generator"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "git", "commit", "message", "generator"]
authors = [{ name = "Bijay Das", email = "me@bijaydas.com" }]
dependencies = [
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "typer>=0.27.1",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
]

[project.scripts]
cmt = "cmt.cli:app"

[project.urls]
Homepage = "https://github.com/bijaydas/cmt"
Documentation = "https://github.com/bijaydas/cmt#readme"
Repository = "https://github.com/bijaydas/cmt"
Issues = "https://github.com/bijaydas/cmt/issues"
Changelog = "https://github.com/bijaydas/cmt/releases"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (common bugs)
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.wheel]
packages = ["src/cmt"]
